name: plainwire

services:
  db:
    image: postgres:18
    restart: unless-stopped
    environment:
      POSTGRES_USER: plainwire
      POSTGRES_PASSWORD: ${PLAINWIRE_DB_PASS:?Set PLAINWIRE_DB_PASS in plainwire.env}
      POSTGRES_DB: plainwire
    volumes:
      - postgres-data:/var/lib/postgresql
    networks: [backend]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U plainwire -d plainwire"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command:
      - sh
      - -ec
      - exec redis-server --save '' --appendonly no --requirepass "$${PLAINWIRE_REDIS_PASSWORD}"
    environment:
      PLAINWIRE_REDIS_PASSWORD: ${PLAINWIRE_REDIS_PASSWORD:?Set PLAINWIRE_REDIS_PASSWORD in plainwire.env}
    networks: [backend]
    healthcheck:
      test: ["CMD-SHELL", "REDISCLI_AUTH=$$PLAINWIRE_REDIS_PASSWORD redis-cli ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 10

  app:
    image: ${PLAINWIRE_IMAGE:?Set PLAINWIRE_IMAGE in plainwire.env}
    restart: unless-stopped
    env_file:
      - ./plainwire.env
    volumes:
      - uploads:/var/lib/plainwire/uploads
      - admin-state:/var/lib/plainwire
    networks: [backend, edge]
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    expose:
      - "8080"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8080/api/health >/dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      PLAINWIRE_HOST: ${PLAINWIRE_HOST:?Set PLAINWIRE_HOST in plainwire.env}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    networks: [edge]
    depends_on:
      app:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"

networks:
  # Fixed edge subnet makes PLAINWIRE_TRUSTED_PROXIES deterministic. Change both
  # this subnet and that setting together if it conflicts with your host network.
  edge:
    ipam:
      config:
        - subnet: 172.30.0.0/24
  backend:
    internal: true

volumes:
  postgres-data:
  uploads:
  admin-state:
  caddy-data:
  caddy-config:
